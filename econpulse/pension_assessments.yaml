# The 2023 pension reform and the official assessments of the system's sustainability (Batch 29b),
# entered by hand from each publisher's own document; `where` says where in it each figure is.
#
# Each document's figures carry a fingerprint. Until `python -m econpulse confirm <id>` records, in
# data/pension_checks.json, that an AI has compared them with the publisher's text, the Pensions page
# marks the document "awaiting AI check". Changing any figure needs a new check.

documents:
  - id: reform2023
    publisher: Government of Spain
    title: "Real Decreto-ley 2/2023, de 16 de marzo, de medidas urgentes para la ampliación de derechos de los pensionistas, la reducción de la brecha de género y el establecimiento de un nuevo marco de sostenibilidad del sistema público de pensiones"
    short: The 2023 pension reform
    published: "17 Mar 2023"
    url: https://www.boe.es/diario_boe/txt.php?id=BOE-A-2023-6967
    figures:
      - label: Intergenerational equity contribution (MEI), 2023
        value: 0.6 points of pay (employer 0.5, worker 0.1)
        where: General Social Security Law, transitional provision 43 (article 1.43 of the decree)
      - label: MEI from 2029 to 2050
        value: 1.2 points of pay (employer 1.0, worker 0.2), rising by 0.1 a year from 2023
        where: transitional provision 43
      - label: Maximum contribution base, 2024-2050
        value: rises each year by inflation plus 1.2 points
        where: transitional provision 38
      - label: Solidarity contribution on pay above the maximum base, 2025
        value: 0.92%, 1% and 1.17% in three bands (up to 10%, 10-50% and over 50% above the base)
        where: transitional provision 42
      - label: Solidarity contribution, 2045
        value: 5.5%, 6% and 7% in the same bands
        where: transitional provision 42
      - label: Maximum pension, 2025-2050
        value: rises each year by the pensions' revaluation plus 0.115 points
        where: transitional provision 39
      - label: Minimum retirement pension with a dependent spouse
        value: from 2027 no lower than the poverty threshold for a two-adult household
        where: additional provision 53
      - label: Spending rule, checked by AIReF every three years from March 2025
        value: average gross pension spending in 2022-2050 (Ageing Report) at most 15% of GDP, adjusted by the gap between the revenue measures' yield and 1.7% of GDP
        where: additional provision 2 of the decree
    mei:                       # points of pay, total (transitional provision 43)
      2023: 0.6
      2024: 0.7
      2025: 0.8
      2026: 0.9
      2027: 1.0
      2028: 1.1
      2029: 1.2
      2050: 1.2
    solidarity:                # % of pay in each band above the maximum base (transitional provision 42)
      2025: [0.92, 1.0, 1.17]
      2026: [1.15, 1.25, 1.46]
      2027: [1.38, 1.5, 1.75]
      2028: [1.60, 1.75, 2.04]
      2029: [1.83, 2.0, 2.33]
      2030: [2.06, 2.25, 2.63]
      2031: [2.29, 2.5, 2.92]
      2032: [2.52, 2.75, 3.21]
      2033: [2.75, 3.0, 3.50]
      2034: [2.98, 3.25, 3.79]
      2035: [3.21, 3.5, 4.08]
      2036: [3.44, 3.75, 4.38]
      2037: [3.67, 4.0, 4.67]
      2038: [3.90, 4.25, 4.96]
      2039: [4.13, 4.5, 5.25]
      2040: [4.35, 4.75, 5.54]
      2041: [4.58, 5.0, 5.83]
      2042: [4.81, 5.25, 6.13]
      2043: [5.04, 5.5, 6.42]
      2044: [5.27, 5.75, 6.71]
      2045: [5.50, 6.0, 7.0]

  - id: ageing_report_2024
