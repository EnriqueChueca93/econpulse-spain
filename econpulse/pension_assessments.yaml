  - id: airef_2025
    publisher: AIReF
    title: "Informe de evaluación de la regla de gasto de pensiones (Informe 2/25)"
    short: AIReF's first check of the spending rule
    published: "31 Mar 2025"
    url: https://www.airef.es/wp-content/uploads/2025/03/Informe_regla_de_gasto_de_pensiones/Informe.pdf
    figures:
      - label: Yield of the revenue measures adopted since 2020
        value: 1.4% of GDP a year on average in 2022-2050
        where: summary and section on the revenue measures
      - label: Average gross pension spending in 2022-2050
        value: 14.6% of GDP (the Ageing Report updated with actual data; 15.4% as published)
        where: summary
      - label: Spending net of the revenue measures, against the limit
        value: 13.2% of GDP, under the 13.3% limit, so the rule is met
        where: summary
      - label: AIReF's own projection
        value: pension spending from 12.7% of GDP in 2022 to 16.1% in 2050
        where: summary and conclusions

  - id: airef_2026
    publisher: AIReF
    title: "Estudio de evaluación de la regla de gasto de pensiones (Estudio 1/2026)"
    short: AIReF's follow-up check
    published: "29 May 2026"
    url: https://www.airef.es/wp-content/uploads/2026/05/Pensiones/Estudio_Regla_Gasto_Pensiones-2026.pdf
    figures:
      - label: Yield of the revenue measures
        value: 1.6% of GDP a year on average in 2022-2050 (1.4% in 2025)
        where: summary
      - label: Spending net of the revenue measures, against the limit
        value: 13.0% of GDP, under the 13.3% limit, so the rule is met
        where: summary
      - label: AIReF's own projection
        value: pension spending from 13% of GDP in 2025 to 16.4% in 2050
        where: section on the pension spending projections
      - label: Public debt in 2050 with policies unchanged
        value: about 123% of GDP; ageing adds about 52 points, 33.9 of them from pensions
        where: section on the sustainability of public finances
      - label: AIReF's view of the rule
        value: met formally, but no guarantee of sustainability; AIReF proposes redesigning it
        where: summary and recommendations

  - id: bde_2023
    publisher: Banco de España
    title: "Informe Anual 2023, capítulo 2: Retos estructurales de la economía española (section 9.2, the public pension system)"
    short: The Banco de España's annual report
    published: "2024"
    url: https://www.bde.es/f/webbe/SES/Secciones/Publicaciones/PublicacionesAnuales/InformesAnuales/23/Fich/InfAnual_2023_Cap2.pdf
    figures:
      - label: Pension spending in 2023 (contributory, non-contributory and civil servants')
        value: 13.1% of GDP, 28.3% of public non-financial spending
        where: section 9.2
      - label: Over the past decade
        value: up 1.1 points of GDP, with over a million more pensions
        where: section 9.2
      - label: Projections it cites for 2050
        value: 17.3% of GDP (Ageing Report), 16.2% (AIReF); pensions from 11.1 million to 16.7 million
        where: section 9.2
      - label: Its conclusion
        value: additional measures will very probably be needed; relying only on higher contributions could harm jobs and competitiveness
        where: section 9.2
