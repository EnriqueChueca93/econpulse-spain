? Average monthly Social Security registrations by sector and by type of work, from the ministry's monthly workbooks. The 1- and 3-month changes use the ministry's own seasonal adjustment; the 12-month change, the figures as published. From January 2026 the sectors follow the new classification of activities (CNAE-2025); Macroscope links construction and services across the change, which moved real estate development from one to the other. Every industry, month by month, is on its own page (Labour market menu, or the chart's More link).
: La afiliación media a la Seguridad Social por sectores y por tipo de trabajo, de los ficheros mensuales del ministerio. Las variaciones de 1 y 3 meses usan la desestacionalización del propio ministerio; la de 12 meses, las cifras publicadas. Desde enero de 2026 los sectores siguen la nueva clasificación de actividades (CNAE-2025); Macroscope enlaza la construcción y los servicios a través del cambio, que pasó la promoción inmobiliaria de uno a otro. Todas las actividades, mes a mes, tienen su propia página (menú Mercado laboral, o el enlace Más del gráfico).
