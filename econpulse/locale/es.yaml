The 2023 reform: La reforma de 2023
? The Banco de España's balance sheet in the Eurosystem, bank lending and deposits, and interest rates, at the end of each year. The Article IV report for Spain has no monetary table, since the ECB sets policy for the euro area; this one follows the IMF's layout for other countries.
: El balance del Banco de España en el Eurosistema, el crédito y los depósitos bancarios y los tipos de interés, a final de cada año. El informe del Artículo IV sobre España no tiene cuadro monetario, porque el BCE fija la política de la zona del euro; este sigue el formato del FMI para otros países.
The ECB rate and what a Taylor rule suggests: El tipo del BCE y lo que sugiere una regla de Taylor
? 'The ECB sets three rates. The one that steers the economy is the deposit facility rate, what banks earn on money left at the central bank: it puts a floor under market rates, and €STR, the overnight rate banks charge each other, trades just below it.'
: 'El BCE fija tres tipos. El que orienta la economía es el de la facilidad de depósito, lo que ganan los bancos por el dinero que dejan en el banco central: pone un suelo a los tipos de mercado, y el €STR, el tipo a un día que se cobran los bancos entre sí, cotiza justo por debajo.'
? The ECB targets 2% inflation on the harmonised index (HICP) for the euro area as a whole. Core inflation leaves out energy and unprocessed food to show the underlying trend; the 3-month pace shows where it is heading.
: El BCE persigue una inflación del 2% en el índice armonizado (IPCA) del conjunto de la zona del euro. La inflación subyacente excluye la energía y los alimentos no elaborados para mostrar la tendencia de fondo; el ritmo a tres meses indica hacia dónde se dirige.
? The ECB's composite indicator of systemic stress (CISS) combines tension in money, bond, share and currency markets and among banks into one number, from 0 (calm) to 1 (crisis). The bad-loan ratio shows how much bank lending is not being repaid.
: El indicador compuesto de tensión sistémica del BCE (CISS) combina la tensión en los mercados monetario, de bonos, de acciones y de divisas y entre los bancos en un solo número, de 0 (calma) a 1 (crisis). La tasa de morosidad muestra cuánto del crédito bancario no se está devolviendo.
The EU's share of Spain's goods trade: El peso de la UE en el comercio de bienes de España
? The European Commission asks firms and households every month how things are going. Surveys come out before the hard data they foreshadow.
: La Comisión Europea pregunta cada mes a empresas y hogares cómo van las cosas. Las encuestas se publican antes que los datos que anticipan.
The FUNCAS Panel is the average of about 19 forecasters (banks, research institutes, consultancies).: El Panel de FUNCAS es la media de unas 19 instituciones (bancos, institutos de análisis y consultoras).
The IMF's outlook: Las perspectivas del FMI
? 'The Social Security''s contributory pensions: how many and how much, by class, scheme and region, what they cost, new and ended pensions, and the maximum and minimum amounts; Spain against its comparators, the ageing population, the 2023 reform and what the official assessments say.'
: 'Las pensiones contributivas de la Seguridad Social: cuántas son y de qué cuantía, por clase, régimen y comunidad, lo que cuestan, las altas y las bajas, y las cuantías máximas y mínimas; España frente a sus comparables, el envejecimiento de la población, la reforma de 2023 y lo que dicen las evaluaciones oficiales.'
