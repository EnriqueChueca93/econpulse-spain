? 'Table 1 of the IMF''s 2026 Article IV report for Spain, rebuilt from public data: actual years from INE, Eurostat and the ECB, projections from the IMF''s World Economic Outlook database. That database publishes only some of the report''s lines, so the others show … in the projection years.'
: 'El cuadro 1 del informe del Artículo IV de 2026 del FMI sobre España, reconstruido con datos públicos: los años observados, del INE, Eurostat y el BCE; las proyecciones, de la base de datos del World Economic Outlook del FMI. Esa base publica solo algunas líneas del informe, así que las demás muestran … en los años de proyección.'
? 'Table 3 of the IMF''s 2026 Article IV report for Spain: bank capital, asset quality and profitability from the IMF''s own Financial Soundness Indicators database, banks'' domestic exposures from the Banco de España, and corporate, household and housing indicators.'
: 'El cuadro 3 del informe del Artículo IV de 2026 del FMI sobre España: capital, calidad de los activos y rentabilidad de los bancos de la base de datos de indicadores de solidez financiera del propio FMI, las exposiciones domésticas de los bancos del Banco de España, e indicadores de empresas, hogares y vivienda.'
? 'Tables 2a and 2b of the IMF''s 2026 Article IV report for Spain: revenue, spending and the balances in euros and in % of GDP, from Eurostat''s accounts for the general government. The World Economic Outlook projects only the totals, so the other lines show … in the projection years.'
: 'Los cuadros 2a y 2b del informe del Artículo IV de 2026 del FMI sobre España: ingresos, gastos y saldos en euros y en % del PIB, de las cuentas de las Administraciones públicas de Eurostat. El World Economic Outlook solo proyecta los totales, así que las demás líneas muestran … en los años de proyección.'
? 'Tables 4 and 5 of the IMF''s 2026 Article IV report for Spain: the balance of payments, in euros and in % of GDP, and external debt by sector and instrument, from Eurostat. The World Economic Outlook projects only the current account, so the other lines show … in the projection years.'
: 'Los cuadros 4 y 5 del informe del Artículo IV de 2026 del FMI sobre España: la balanza de pagos, en euros y en % del PIB, y la deuda externa por sector e instrumento, de Eurostat. El World Economic Outlook solo proyecta la cuenta corriente, así que las demás líneas muestran … en los años de proyección.'
