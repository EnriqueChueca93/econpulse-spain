? The general government (state, regions, local councils and social security) as reported to the European Commission. EU rules set reference values of a 3% deficit and 60% debt.
: Las Administraciones públicas (Estado, comunidades autónomas, corporaciones locales y Seguridad Social), según lo notificado a la Comisión Europea. Las reglas de la UE fijan valores de referencia de un 3% de déficit y un 60% de deuda.
