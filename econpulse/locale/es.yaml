? As the baby-boom generations reach retirement, a growing share of adults are past working age, which pulls down the participation and employment rates of everyone aged 15 and over even when each age group works as much as before. Macroscope holds the population's mix by sex and five-year age group at its 2008 shares, letting each group's own rate move, to show how much of the change comes from ageing.
: A medida que las generaciones del baby boom llegan a la jubilación, una parte creciente de los adultos ha pasado la edad de trabajar, lo que rebaja las tasas de actividad y de empleo del conjunto de mayores de 15 años aunque cada grupo de edad trabaje tanto como antes. Macroscope mantiene la composición de la población por sexo y grupos de cinco años de edad en sus pesos de 2008, dejando que se mueva la tasa de cada grupo, para mostrar cuánto del cambio se debe al envejecimiento.
