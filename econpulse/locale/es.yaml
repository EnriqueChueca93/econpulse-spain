? 'Spain has no monetary policy of its own: the European Central Bank sets rates for the whole euro area. The IMF-style monetary table shows what that means for the Banco de España and Spanish banks.'
: 'España no tiene política monetaria propia: el Banco Central Europeo fija los tipos de toda la zona del euro. El cuadro monetario al estilo del FMI muestra lo que eso supone para el Banco de España y los bancos españoles.'
? Spain is one of the world's most visited countries. Arrivals and spending come from INE's border surveys (FRONTUR, EGATUR), receipts from the balance of payments.
: España es uno de los países más visitados del mundo. Las llegadas y el gasto proceden de las encuestas en frontera del INE (FRONTUR, EGATUR); los ingresos, de la balanza de pagos.
Spain minus euro area: España menos zona del euro
? 'Spain next to the euro area and ten comparators: France, Germany, Italy, the Netherlands, Portugal and Poland in the EU, and the United Kingdom, the United States, Canada and Japan. The sections below take growth, jobs, prices and interest rates, the public finances, the current account and the IMF''s outlook in turn.'
: 'España junto a la zona del euro y diez comparables: Francia, Alemania, Italia, los Países Bajos, Portugal y Polonia en la UE, y el Reino Unido, Estados Unidos, Canadá y Japón. Las secciones siguientes repasan, una a una, el crecimiento, el empleo, los precios y los tipos de interés, las finanzas públicas, la balanza por cuenta corriente y las perspectivas del FMI.'
? 'Spain next to the euro area and ten comparators: France, Germany, Italy, the Netherlands, Portugal, Poland, the United Kingdom, the United States, Canada and Japan; growth, jobs, prices, public finances and the IMF''s outlook.'
: 'España junto a la zona del euro y diez comparables: Francia, Alemania, Italia, los Países Bajos, Portugal, Polonia, el Reino Unido, Estados Unidos, Canadá y Japón; crecimiento, empleo, precios, finanzas públicas y las previsiones del FMI.'
? Spain's 10-year yield is the German Bund yield, which moves with euro-area interest rates and inflation expectations, plus the prima de riesgo, the extra return investors demand to hold Spanish debt. Which part moved says whether the change is about the euro area or about Spain. Here the prima de riesgo is the Spanish yield minus the Bund, so the parts add up; Banco de España's headline spread (the tile above) uses benchmark bonds and can differ by a few bp.
: La rentabilidad del bono español a 10 años es la del Bund alemán, que se mueve con los tipos de interés y las expectativas de inflación de la zona del euro, más la prima de riesgo, la rentabilidad adicional que exigen los inversores por tener deuda española. Qué parte se ha movido indica si el cambio tiene que ver con la zona del euro o con España. Aquí la prima de riesgo es la rentabilidad española menos la del Bund, de modo que las partes suman; el diferencial de referencia del Banco de España (el recuadro de arriba) usa bonos de referencia y puede diferir en unos pocos puntos básicos.
? Spain's 10-year yield is the German yield plus the prima de riesgo. Splitting a move into the two shows whether it is about euro-area rates or about Spain.
: La rentabilidad del bono español a 10 años es la alemana más la prima de riesgo. Dividir un movimiento en esas dos partes muestra si tiene que ver con los tipos de la zona del euro o con España.
Spain's 10-year yield over Germany's, basis points, daily; it peaked at 636 bp in July 2012: Rentabilidad a 10 años de España sobre la de Alemania, puntos básicos, diario; tocó máximo en 636 pb en julio de 2012
Spain's 10-year yield, in two parts: La rentabilidad a 10 años de España, en dos partes
? Spain's 17 autonomous communities differ widely in unemployment, house prices and income per head. Regional figures come from INE's labour force survey, house price index, CPI and regional accounts.
: Las 17 comunidades autónomas de España difieren mucho en paro, precios de la vivienda y renta per cápita. Las cifras regionales proceden de la encuesta de población activa, el índice de precios de vivienda, el IPC y la contabilidad regional del INE.
? Spain's exports and imports of services by type, from the balance of payments. Tourism is the largest single item, but the other services together bring in more than half of exports.
: Las exportaciones e importaciones de servicios de España por tipo, según la balanza de pagos. El turismo es la mayor partida, pero los demás servicios juntos aportan más de la mitad de las exportaciones.
Spain's gross public pension spending, 2022: Gasto público bruto en pensiones de España, 2022
? 'Spain''s house prices next to its comparators'', from the OECD: real prices, and prices against incomes and against rents, each next to its own long-run average. The chips choose which countries the chart draws beside Spain.'
: 'Los precios de la vivienda en España junto a los de sus comparables, según la OCDE: precios reales y precios frente a la renta y frente a los alquileres, cada uno junto a su propia media de largo plazo. Los botones eligen qué países se dibujan en el gráfico junto a España.'
? Spain's own consumer price index. Core inflation leaves out energy and unprocessed food, the most volatile prices; INE splits the rest into services, goods and processed food.
: El índice de precios de consumo de España. La inflación subyacente deja fuera la energía y los alimentos no elaborados, los precios más volátiles; el INE divide el resto en servicios, bienes y alimentos elaborados.
Spain's transactions with the rest of the world, and the investment position they build up.: Las transacciones de España con el resto del mundo y la posición de inversión que van acumulando.
? Spain's yield is the German yield plus the prima de riesgo, so the two parts add up to the total. A rising Bund means rates are rising across the euro area; a rising prima de riesgo is about Spain.
: La rentabilidad española es la alemana más la prima de riesgo, así que las dos partes suman el total. Si sube el Bund, suben los tipos en toda la zona del euro; si sube la prima de riesgo, la causa está en España.
