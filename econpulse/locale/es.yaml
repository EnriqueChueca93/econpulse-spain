The intergenerational equity contribution (MEI): El Mecanismo de Equidad Intergeneracional (MEI)
? The labour cost survey (ETCL) is not seasonally adjusted and bonuses move between quarters, so pay is compared with a year earlier. The collective-agreements figure is the average rise agreed for the current year in agreements registered so far, not a change on a year earlier.
: La encuesta de coste laboral (ETCL) no está desestacionalizada y las pagas extraordinarias cambian de trimestre, así que los salarios se comparan con un año antes. La cifra de convenios es la subida media pactada para el año en curso en los convenios registrados hasta ahora, no una variación interanual.
? The labour force survey by group, from Eurostat. Employment rates have risen for every group since 2019, most for women and people aged 55–64, and prime-age employment (25–54) is closing in on the euro area's. Charts show averages of the past four quarters, as the figures are not seasonally adjusted.
: La encuesta de población activa por grupos, de Eurostat. Las tasas de empleo han subido en todos los grupos desde 2019, sobre todo entre las mujeres y las personas de 55 a 64 años, y el empleo en edad central (25–54) se acerca al de la zona del euro. Los gráficos muestran medias de los últimos cuatro trimestres, porque las cifras no están desestacionalizadas.
? The latest close and how far each market has moved. Yields come from Banco de España, exchange rates are the ECB's daily reference rates and Brent is the US EIA spot price (via FRED).
: El último cierre y cuánto se ha movido cada mercado. Las rentabilidades proceden del Banco de España, los tipos de cambio son los tipos de referencia diarios del BCE y el Brent es el precio al contado de la EIA estadounidense (a través de FRED).
? 'The latest forecasts for Spain this year and next, with Macroscope''s own figure for this year''s GDP. Each forecaster''s row shows when it was published: forecasts made months apart saw different data, so differences are partly about timing.'
: 'Las últimas previsiones para España de este año y el próximo, con la cifra propia de Macroscope para el PIB de este año. La fila de cada institución indica cuándo se publicó: las previsiones hechas con meses de diferencia partían de datos distintos, así que las diferencias se deben en parte al momento en que se hicieron.'
? The model also uses the previous quarter's GDP growth. Months not yet published are projected from each series' recent momentum (an AR(1) model), so early in a quarter the nowcast leans on those projections.
: El modelo usa también el crecimiento del PIB del trimestre anterior. Los meses aún no publicados se proyectan a partir de la inercia reciente de cada serie (un modelo AR(1)), así que al principio de un trimestre la estimación adelantada se apoya en esas proyecciones.
The mortgage rate is the ECB's average for new house-purchase loans to Spanish households.: El tipo hipotecario es la media del BCE para los préstamos nuevos para compra de vivienda a hogares españoles.
? 'The next three months, day by day: the darker the day, the more releases it has, and the number in its corner says how many. Click a day to see them.'
: 'Los próximos tres meses, día a día: cuanto más oscuro el día, más publicaciones tiene, y el número de su esquina dice cuántas. Pulse en un día para verlas.'
The next two months: Los próximos dos meses
The page you asked for is not on Macroscope Spain.: La página que busca no está en Macroscope España.
? The posts firms and public bodies are trying to fill, from INE's labour cost survey. Vacancies are few in Spain by European standards, and a large share of them are in public administration.
: Los puestos que las empresas y los organismos públicos intentan cubrir, de la encuesta de coste laboral del INE. En España hay pocas vacantes para lo habitual en Europa, y una gran parte está en la Administración pública.
The quarterly balance is not seasonally adjusted, so it is averaged over four quarters.: El saldo trimestral no está desestacionalizado, así que se promedia en cuatro trimestres.
