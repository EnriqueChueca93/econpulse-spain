? AAA yields are the ECB's estimate of the curve for AAA-rated euro-area governments, the closest thing to a risk-free euro rate. Banco de España's prima de riesgo uses benchmark bonds, so it differs a little from Spain's 10-year yield minus Germany's.
: Las rentabilidades AAA son la estimación del BCE de la curva de los gobiernos de la zona del euro con calificación AAA, lo más parecido a un tipo del euro sin riesgo. La prima de riesgo del Banco de España usa bonos de referencia, así que difiere algo de la rentabilidad a 10 años de España menos la de Alemania.
