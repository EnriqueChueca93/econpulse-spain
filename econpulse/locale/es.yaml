? 'There is no free feed of the swap rates traders use to price ECB decisions. As a rough stand-in, these are forward rates on AAA euro-area government bonds: the short-term rate the bond market implies for each future date. They include a term premium, so they tend to overstate the expected path, more so further out.'
: 'No hay una fuente gratuita de los tipos swap que usan los operadores para anticipar las decisiones del BCE. Como aproximación, estos son los tipos a plazo de la deuda pública AAA de la zona del euro: el tipo a corto plazo que el mercado de bonos descuenta para cada fecha futura. Incluyen una prima por plazo, así que tienden a exagerar la senda esperada, más cuanto más lejos.'
