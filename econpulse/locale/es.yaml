? A Taylor rule turns inflation and slack into a suggested policy rate. Run on euro-area data it is a yardstick for the ECB; run on Spanish data it shows the rate Spain would get if it set its own, the cost of one rate for all.
: 'Una regla de Taylor convierte la inflación y la holgura de la economía en un tipo oficial sugerido. Aplicada a los datos de la zona del euro, es una vara de medir para el BCE; aplicada a los datos españoles, muestra el tipo que tendría España si fijara el suyo propio: el coste de un tipo único para todos.'
A budget balance below zero is a deficit.: Un saldo presupuestario negativo es un déficit.
? 'A few big price moves, like energy, can push headline inflation around. These measures look at the whole spread of price changes across about 180 detailed items of the harmonised basket: the weighted median is the rate half the basket is rising faster than, and the trimmed means average what is left after dropping the most extreme rises and falls. Macroscope calculation from Eurostat data, following the method the ECB uses for the euro area.'
: 'Unos pocos movimientos grandes de precios, como los de la energía, pueden zarandear la inflación general. Estas medidas miran toda la distribución de las variaciones de precios en unas 180 partidas detalladas de la cesta armonizada: la mediana ponderada es la tasa por encima de la cual sube la mitad de la cesta, y las medias recortadas promedian lo que queda tras quitar las subidas y bajadas más extremas. Cálculo de Macroscope con datos de Eurostat, con el método que usa el BCE para la zona del euro.'
A month earlier: Un mes antes
A negative balance is a deficit.: Un saldo negativo es un déficit.
A running read on the health of the Spanish economy.: Una lectura continua del estado de la economía española.
? A z-score of +1 means one typical deviation above the 2013–present norm (Covid years left out). Weights fall by a quarter for each month a reading is older than the newest data.
: Una puntuación z de +1 significa una desviación típica por encima de la norma de 2013 hasta hoy (sin los años de la COVID). Los pesos bajan una cuarta parte por cada mes que un dato es más antiguo que el más reciente.
? AAA yields are the ECB's estimate of the curve for AAA-rated euro-area governments, the closest thing to a risk-free euro rate. Banco de España's prima de riesgo uses benchmark bonds, so it differs a little from Spain's 10-year yield minus Germany's.
: Las rentabilidades AAA son la estimación del BCE de la curva de los gobiernos de la zona del euro con calificación AAA, lo más parecido a un tipo del euro sin riesgo. La prima de riesgo del Banco de España usa bonos de referencia, así que difiere algo de la rentabilidad a 10 años de España menos la de Alemania.
