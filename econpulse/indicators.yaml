# EconPulse Spain indicator registry.
#
# One entry per series. Fields:
#   id           unique name, also the CSV file name in data/series/
#   label        English name;  label_es: official Spanish name
#   section      gdp | labour | wages | inflation | financial | ecb | fiscal | activity | housing | international |
#                regions | analysis
#   source       ine | eurostat | ecb | bde | segsocial | ree | oecd | bis | bls | dbnomics | eia | worldbank |
#                bundesbank | imf | bdeproj (Banco de España projections) | funcas |
#                hicpdist (underlying inflation from Eurostat's detailed HICP items) |
#                fred | derived  (FRED does not answer GitHub's servers, so the online site avoids it)
#   key, params  what to ask the source for (see econpulse/sources/<source>.py)
#   freq         D | M | Q | A
#   unit         unit of the stored series: "%", "% of GDP", "bp", "pp", "thousands", "$/bbl", "€/MWh",
#                "€ mn", "€", or a plain number shown without suffix: "index", "balance", "rate"
#   scale        multiply fetched values (default 1), e.g. 0.001 for persons -> thousands
#   transforms   how to show it; the first one is the headline (level, pop, yoy, ann3m, saar, diff, diff_yoy;
#                sa_pop, sa_diff… first apply EconPulse seasonal adjustment)
#   decimals     decimals to display (default 1)
#   change_unit  pp | bp for rates; % for relative change (prices, indices, exchange rates)
#   tile         position in the home-page key-indicators strip (omit if not a tile)
#   max_age_days flag the series as "not updating" past this age (defaults by freq)
#   for_each     a list of items (countries, regions): the entry is repeated for each one,
#                with {placeholders} in its strings filled from the item's fields
#
# INE codes are series codes (not table ids): INE moves series to new tables when
# it rebases, so check `python -m econpulse status` if a series stops updating.
# What the section pages show (tables, charts) is defined in econpulse/pages.py.

# Lists used by for_each entries (YAML anchors: &name here, *name below).
countries: &countries
  - {slug: de, geo: DE, name: Germany, name_es: Alemania}
  - {slug: fr, geo: FR, name: France, name_es: Francia}
  - {slug: it, geo: IT, name: Italy, name_es: Italia}
  - {slug: pt, geo: PT, name: Portugal, name_es: Portugal}
  - {slug: nl, geo: NL, name: Netherlands, name_es: Países Bajos}

# Other economies, from the OECD (CPI, unemployment, GDP, 10-year yields) and the BIS (policy rates).
# Japan's CPI comes from the BIS: the OECD's stops in 2021.
peers: &peers
  - {slug: uk, oecd: GBR, bis: GB, name: United Kingdom, name_es: Reino Unido,
     cpi_source: oecd, cpi_key: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL,1.0/GBR.M.N.CPI.PA._T.N.GY"}
  - {slug: jp, oecd: JPN, bis: JP, name: Japan, name_es: Japón,
     cpi_source: bis, cpi_key: "WS_LONG_CPI/M.JP.771"}
  - {slug: ca, oecd: CAN, bis: CA, name: Canada, name_es: Canadá,
     cpi_source: oecd, cpi_key: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL,1.0/CAN.M.N.CPI.PA._T.N.GY"}

# The 17 autonomous communities with their INE series codes: unemployment rate (EPA),
# house price index (IPV), CPI annual rate (IPC) and GDP per head, Spain = 100 (CRE).
regions: &regions
  - {slug: andalucia, name: Andalucía, epa: EPA452440, ipv: IPV1623, ipc: IPC293659, cre: CRE47440}
  - {slug: aragon, name: Aragón, epa: EPA452448, ipv: IPV1638, ipc: IPC293715, cre: CRE47439}
  - {slug: asturias, name: Asturias, epa: EPA452456, ipv: IPV1653, ipc: IPC293771, cre: CRE47438}
  - {slug: baleares, name: Illes Balears, epa: EPA452464, ipv: IPV1668, ipc: IPC293827, cre: CRE47437}
  - {slug: canarias, name: Canarias, epa: EPA452472, ipv: IPV1534, ipc: IPC293883, cre: CRE47436}
  - {slug: cantabria, name: Cantabria, epa: EPA452480, ipv: IPV1549, ipc: IPC293939, cre: CRE47435}
  - {slug: castilla_leon, name: Castilla y León, epa: EPA452488, ipv: IPV1564, ipc: IPC293995, cre: CRE47434}
  - {slug: castilla_mancha, name: Castilla-La Mancha, epa: EPA452496, ipv: IPV1579, ipc: IPC294051, cre: CRE47433}
  - {slug: cataluna, name: Cataluña, epa: EPA452504, ipv: IPV1594, ipc: IPC294107, cre: CRE47432}
  - {slug: valenciana, name: Comunitat Valenciana, epa: EPA452512, ipv: IPV1392, ipc: IPC294163, cre: CRE47431}
  - {slug: extremadura, name: Extremadura, epa: EPA452520, ipv: IPV1407, ipc: IPC294219, cre: CRE47430}
  - {slug: galicia, name: Galicia, epa: EPA452528, ipv: IPV1422, ipc: IPC294275, cre: CRE47429}
  - {slug: madrid, name: Madrid, epa: EPA452536, ipv: IPV1437, ipc: IPC294331, cre: CRE47428}
  - {slug: murcia, name: Murcia, epa: EPA452544, ipv: IPV1452, ipc: IPC294387, cre: CRE47427}
  - {slug: navarra, name: Navarra, epa: EPA452552, ipv: IPV1467, ipc: IPC294443, cre: CRE47426}
  - {slug: pais_vasco, name: País Vasco, epa: EPA452560, ipv: IPV1482, ipc: IPC294499, cre: CRE47425}
  - {slug: rioja, name: La Rioja, epa: EPA452568, ipv: IPV1497, ipc: IPC294555, cre: CRE47424}

# What the forecasters read automatically predict (see the Forecasts part at the end), with
# each source's code for it: the IMF's WEO indicator and the Banco de España's table row.
forecast_measures: &forecast_measures
  - {m: gdp, name: real GDP growth, name_es: crecimiento del PIB real, unit: "%", imf: NGDP_RPCH, bde: GDP}
  - {m: inflation, name: inflation, name_es: inflación, unit: "%", imf: PCPIPCH, bde: HICP}
  - {m: unemployment, name: unemployment rate, name_es: tasa de paro, unit: "%", imf: LUR, bde: Unemployment rate}
  - {m: balance, name: government budget balance, name_es: saldo de las AA. PP., unit: "% of GDP", imf: GGXCNL_NGDP,
     bde: General government net lending}
# The government publishes no inflation forecast.
government_measures: &government_measures
  - {m: gdp, name: real GDP growth, name_es: crecimiento del PIB real, unit: "%"}
  - {m: unemployment, name: unemployment rate, name_es: tasa de paro, unit: "%"}
  - {m: balance, name: government budget balance, name_es: saldo de las AA. PP., unit: "% of GDP"}

indicators:

  # ---------------------------------------------------------------- GDP (INE CNTR)
  # Chain-linked volume indices, seasonally and calendar adjusted.
  - id: gdp
    label: Real GDP
    label_es: Producto interior bruto (volumen)
    section: gdp
    source: ine
    key: CNTR6652
    freq: Q
    unit: index
    transforms: [pop, yoy]

    tile: 1
  - id: domestic_demand
    label: Domestic demand
    label_es: Demanda nacional
    section: gdp
    source: ine
    key: CNTR7146
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_households
    label: Household consumption
    label_es: Gasto en consumo final de los hogares
    section: gdp
    source: ine
    key: CNTR7161
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_government
    label: Government consumption
    label_es: Gasto en consumo final de las AAPP
    section: gdp
    source: ine
    key: CNTR7186
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment
    label: Fixed investment
    label_es: Formación bruta de capital fijo
    section: gdp
    source: ine
    key: CNTR7211
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports
    label: Exports
    label_es: Exportaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7265
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: imports
    label: Imports
    label_es: Importaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7285
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_construction
    label: Investment in construction
    label_es: FBCF en construcción
    section: gdp
    source: ine
    key: CNTR7221
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_housing
    label: Investment in housing
    label_es: FBCF en viviendas
    section: gdp
    source: ine
    key: CNTR7226
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_equipment
    label: Investment in machinery and equipment
    label_es: FBCF en maquinaria, bienes de equipo y sistemas de armamento
    section: gdp
    source: ine
    key: CNTR7236
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_goods
    label: Exports of goods
    label_es: Exportaciones de bienes
    section: gdp
    source: ine
    key: CNTR7270
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_services
    label: Exports of services
    label_es: Exportaciones de servicios
    section: gdp
    source: ine
    key: CNTR7275
    freq: Q
    unit: index
    transforms: [pop, yoy]
    notes: Includes spending by foreign tourists in Spain.

  # Contributions to GDP growth, in percentage points, as published by INE.
  - id: contrib_domestic_qq
    label: Domestic demand, contribution to q/q growth
    label_es: Demanda nacional, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7149
    freq: Q
    unit: pp

  - id: contrib_external_qq
    label: External demand, contribution to q/q growth
    label_es: Demanda externa, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7263
    freq: Q
    unit: pp

  - id: contrib_domestic_yy
    label: Domestic demand, contribution to y/y growth
    label_es: Demanda nacional, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7150
    freq: Q
    unit: pp

  - id: contrib_external_yy
    label: External demand, contribution to y/y growth
    label_es: Demanda externa, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7264
    freq: Q
    unit: pp

  # Output by sector: gross value added, chain-linked volumes, adjusted.
  - id: gva_agriculture
    label: Gross value added, agriculture
    label_es: VAB agricultura, ganadería, silvicultura y pesca
    section: gdp
    source: ine
    key: CNTR6657
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_industry
    label: Gross value added, industry
    label_es: VAB industria
    section: gdp
    source: ine
    key: CNTR6662
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_construction
    label: Gross value added, construction
    label_es: VAB construcción
    section: gdp
    source: ine
    key: CNTR6672
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_services
    label: Gross value added, services
    label_es: VAB servicios
    section: gdp
    source: ine
    key: CNTR6677
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gdp_nominal
    label: Nominal GDP
    label_es: PIB a precios corrientes
    section: gdp
    source: ine
    key: CNTR6597
    freq: Q
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, pop]
    notes: Current prices, seasonally and calendar adjusted, euros million per quarter.

  - id: gdp_deflator
    label: GDP deflator
    label_es: Deflactor implícito del PIB
    section: gdp
    source: derived
    key: divide
    params: {a: gdp_nominal, b: gdp}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Nominal GDP divided by real GDP; the price of everything Spain produces.

  - id: jobs_fte
    label: Employment, full-time equivalent jobs
    label_es: Puestos de trabajo equivalentes a tiempo completo
    section: gdp
    source: ine
    key: CNTR7818
    freq: Q
    unit: thousands
    transforms: [yoy, pop]
    notes: National accounts measure, seasonally and calendar adjusted.

  # Already published as % changes on a year earlier.
  - id: productivity_fte
    label: Productivity per FTE job, y/y
    label_es: Productividad por puesto de trabajo equivalente a tiempo completo
    section: gdp
    source: ine
    key: CNTR8241
    freq: Q
    unit: "%"
    change_unit: pp

  - id: productivity_hour
    label: Productivity per hour worked, y/y
    label_es: Productividad por hora efectivamente trabajada
    section: gdp
    source: ine
    key: CNTR8242
    freq: Q
    unit: "%"
    change_unit: pp

  - id: unit_labour_cost
    label: Unit labour cost, y/y
    label_es: Coste laboral unitario
    section: gdp
    source: ine
    key: CNTR8244
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Compensation per employee relative to productivity.

  # ---------------------------------------------------------------- Labour
  - id: afiliados
    label: Social Security registrations
    label_es: Afiliados medios a la Seguridad Social
    section: labour
    source: segsocial
    key: TOTAL SISTEMA
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [sa_diff, diff_yoy, yoy]
    tile: 2
    notes: Monthly average, total system. The monthly change is seasonally adjusted by EconPulse; the y/y change is as published.

  - id: unemployment_epa
    label: Unemployment rate (EPA)
    label_es: Tasa de paro (EPA)
    section: labour
    source: ine
    key: EPA423474
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    tile: 3
    notes: Labour force survey, not seasonally adjusted. The official measure.

  - id: employment_epa
    label: Employment (EPA)
    label_es: Ocupados (EPA)
    section: labour
    source: ine
    key: EPA387796
    freq: Q
    unit: thousands
    transforms: [yoy, diff_yoy, level]

  - id: unemployment_monthly
    label: Unemployment rate, monthly (SA)
    label_es: Tasa de paro mensual (desestacionalizada)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp
    notes: Eurostat's monthly estimate, benchmarked to the EPA.

  - id: youth_unemployment
    label: Youth unemployment rate (<25, SA)
    label_es: Tasa de paro juvenil (<25)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: Y_LT25, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp

  - id: paro_registrado
    label: Registered unemployment
    label_es: Paro registrado
    section: labour
    source: bde
    key: D_1JA0D000
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [diff_yoy, yoy]
    notes: Job seekers registered at public employment offices (SEPE), end of month, not seasonally adjusted.

  - id: activity_rate
    label: Activity rate (EPA)
    label_es: Tasa de actividad (EPA)
    section: labour
    source: ine
    key: EPA388038
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are working or looking for work.

  - id: employment_rate
    label: Employment rate (EPA)
    label_es: Tasa de empleo (EPA)
    section: labour
    source: ine
    key: EPA388039
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are in work.

  - id: temporary_rate
    label: Temporary employment rate (EPA)
    label_es: Tasa de temporalidad (EPA)
    section: labour
    source: ine
    key: EPA416256
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Employees on temporary contracts, % of all employees. The 2022 labour reform cut it sharply.

  - id: long_term_unemployment
    label: Long-term unemployment rate
    label_es: Tasa de paro de larga duración
    section: labour
    source: eurostat
    key: une_ltu_q
    params: {geo: ES, indic_em: LTU, unit: PC_ACT, s_adj: NSA, age: Y15-74, sex: T}
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Unemployed for 12 months or more, % of the labour force aged 15-74 (Eurostat, from the EPA).

  - id: labour_slack
    label: Labour market slack
    label_es: Holgura del mercado laboral
    section: labour
    source: eurostat
    key: lfsi_sla_q
    params: {geo: ES, wstatus: SLACK, unit: PC_ELF, s_adj: SA, sex: T, age: Y15-74}
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Unemployed people, part-timers who want more hours and people available but not looking, % of the extended labour force (Eurostat).

  - id: vacancies
    label: Job vacancies
    label_es: Puestos de trabajo vacantes (ETCL)
    section: labour
    source: ine
    key: ETCL2925
    freq: Q
    unit: thousands
    scale: 0.001
    transforms: [level, yoy]
    notes: Posts firms are trying to fill, from INE's labour cost survey; not seasonally adjusted.

  # ---------------------------------------------------------------- Wages
  - id: wage_cost
    label: Wage cost per worker
    label_es: Coste salarial total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL67
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Monthly average per worker in the quarter, not seasonally adjusted.

  - id: wage_cost_ordinary
    label: Ordinary wage cost per worker
    label_es: Coste salarial ordinario por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL66
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Regular pay, leaving out bonuses and back pay; a steadier read on wage growth.

  - id: wage_cost_hour
    label: Wage cost per hour
    label_es: Coste salarial total por hora efectiva (ETCL)
    section: wages
    source: ine
    key: ETCL4371
    freq: Q
    unit: "€"
    decimals: 2
    transforms: [yoy, level]

  - id: labour_cost
    label: Total labour cost per worker
    label_es: Coste laboral total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL68
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Wages plus employers' social contributions and other costs.

  - id: lci_wages
    label: Labour cost index, wages and salaries (SA)
    label_es: Índice de costes laborales, sueldos y salarios
    section: wages
    source: eurostat
    key: lc_lci_r2_q
    params: {geo: ES, unit: I20, s_adj: SCA, lcstruct: D11, nace_r2: B-S}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Eurostat's harmonised measure, seasonally and calendar adjusted.

  - id: compensation_per_employee
    label: Compensation per employee, y/y
    label_es: Remuneración por puesto de trabajo equivalente asalariado
    section: wages
    source: ine
    key: CNTR8243
    freq: Q
    unit: "%"
    change_unit: pp
    notes: National accounts, per full-time equivalent employee.

  - id: wage_agreements
    label: Pay rise agreed in collective agreements
    label_es: Incremento salarial medio pactado en convenios
    section: wages
    source: bde
    key: DCC_M.VS.TOT.TOT._Z.TOT.25000.AC
    freq: M
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Average increase agreed for the current year in agreements registered so far (Ministerio de Trabajo); it restarts each January.

  # ---------------------------------------------------------------- Inflation
  - id: cpi
    label: CPI inflation
    label_es: IPC general, variación anual
    section: inflation
    source: ine
    key: IPC290750
    freq: M
    unit: "%"
    change_unit: pp

    tile: 5
  - id: core_cpi
    label: Core CPI inflation
    label_es: IPC subyacente, variación anual
    section: inflation
    source: ine
    key: IPC292510
    freq: M
    unit: "%"
    change_unit: pp
    tile: 6
    notes: Excludes unprocessed food and energy (INE definition).

  - id: cpi_index
    label: CPI index
    label_es: IPC general, índice
    section: inflation
    source: ine
    key: IPC290751
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  - id: core_cpi_index
    label: Core CPI index
    label_es: IPC subyacente, índice
    section: inflation
    source: ine
    key: IPC292511
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  # CPI special groups (INE "grupos especiales"): core = processed food + goods + services.
  - id: cpi_services_index
    label: CPI services
    label_es: IPC servicios, índice
    section: inflation
    source: ine
    key: IPC292495
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_goods_index
    label: CPI non-energy industrial goods
    label_es: IPC bienes industriales sin productos energéticos, índice
    section: inflation
    source: ine
    key: IPC292531
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_processed_food_index
    label: CPI processed food, drinks and tobacco
    label_es: IPC alimentos con elaboración, bebidas y tabaco, índice
    section: inflation
    source: ine
    key: IPC292543
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_unprocessed_food_index
    label: CPI unprocessed food
    label_es: IPC alimentos sin elaboración, índice
    section: inflation
    source: ine
    key: IPC292443
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_energy_index
    label: CPI energy
    label_es: IPC productos energéticos, índice
    section: inflation
    source: ine
    key: IPC292459
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_rent_index
    label: CPI rents
    label_es: IPC vivienda en alquiler, índice
    section: inflation
    source: ine
    key: IPC292307
    freq: M
    unit: index
    transforms: [yoy, pop]

  # Needs the CPI index above, so it sits here rather than with the other wages.
  - id: real_wage
    label: Real wage cost per worker
    label_es: Coste salarial por trabajador deflactado por el IPC
    section: wages
    source: derived
    key: deflate
    params: {a: wage_cost, b: cpi_index, period: Q}
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy]
    notes: Wage cost per worker (ETCL) divided by the CPI averaged over the quarter.

  - id: ppi
    label: Producer prices
    label_es: Índice de precios industriales, mercado interior
    section: inflation
    source: ine
    key: IPR34522
    freq: M
    unit: index
    transforms: [yoy, pop]
    notes: Prices charged by Spanish industry on the domestic market; an early signal for consumer prices.

  - id: hicp
    label: HICP inflation
    label_es: IPCA, variación anual
