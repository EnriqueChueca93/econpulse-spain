# EconPulse Spain indicator registry.
#
# One entry per series. Fields:
#   id           unique name, also the CSV file name in data/series/
#   label        English name;  label_es: official Spanish name
#   section      gdp | labour | wages | inflation | financial | ecb | fiscal | activity | housing | international
#   source       ine | eurostat | ecb | bde | segsocial | fred | ree | derived
#   key, params  what to ask the source for (see econpulse/sources/<source>.py)
#   freq         D | M | Q | A
#   unit         unit of the stored series: "%", "% of GDP", "bp", "thousands", "$/bbl", "€/MWh",
#                "€ mn", "€", or a plain number shown without suffix: "index", "balance", "rate"
#   scale        multiply fetched values (default 1), e.g. 0.001 for persons -> thousands
#   transforms   how to show it; the first one is the headline (level, pop, yoy, ann3m, saar, diff, diff_yoy)
#   decimals     decimals to display (default 1)
#   change_unit  pp | bp for rates; % for relative change (prices, indices, exchange rates)
#   tile         position in the home-page key-indicators strip (omit if not a tile)
#   max_age_days flag the series as "not updating" past this age (defaults by freq)
#
# INE codes are series codes (not table ids): INE moves series to new tables when
# it rebases, so check `python -m econpulse status` if a series stops updating.

indicators:

  # ---------------------------------------------------------------- GDP (INE CNTR)
  # Chain-linked volume indices, seasonally and calendar adjusted.
  - id: gdp
    label: Real GDP
    label_es: Producto interior bruto (volumen)
    section: gdp
    source: ine
    key: CNTR6652
    freq: Q
    unit: index
    transforms: [pop, yoy]

    tile: 1
  - id: domestic_demand
    label: Domestic demand
    label_es: Demanda nacional
    section: gdp
    source: ine
    key: CNTR7146
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_households
    label: Household consumption
    label_es: Gasto en consumo final de los hogares
    section: gdp
    source: ine
    key: CNTR7161
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_government
    label: Government consumption
    label_es: Gasto en consumo final de las AAPP
    section: gdp
    source: ine
    key: CNTR7186
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment
    label: Fixed investment
    label_es: Formación bruta de capital fijo
    section: gdp
    source: ine
    key: CNTR7211
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports
    label: Exports
    label_es: Exportaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7265
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: imports
    label: Imports
    label_es: Importaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7285
    freq: Q
    unit: index
    transforms: [pop, yoy]

  # ---------------------------------------------------------------- Labour
  - id: afiliados
    label: Social Security registrations
    label_es: Afiliados medios a la Seguridad Social
    section: labour
    source: segsocial
    key: TOTAL SISTEMA
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [diff_yoy, yoy, diff]
    tile: 2
    notes: Monthly average, total system, not seasonally adjusted (seasonal adjustment comes in Batch 4).

  - id: unemployment_epa
    label: Unemployment rate (EPA)
    label_es: Tasa de paro (EPA)
    section: labour
    source: ine
    key: EPA423474
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    tile: 3
    notes: Labour force survey, not seasonally adjusted. The official measure.

  - id: employment_epa
    label: Employment (EPA)
    label_es: Ocupados (EPA)
    section: labour
    source: ine
    key: EPA387796
    freq: Q
    unit: thousands
    transforms: [yoy, diff_yoy, level]

  - id: unemployment_monthly
    label: Unemployment rate, monthly (SA)
    label_es: Tasa de paro mensual (desestacionalizada)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp
    notes: Eurostat's monthly estimate, benchmarked to the EPA.

  - id: youth_unemployment
    label: Youth unemployment rate (<25, SA)
    label_es: Tasa de paro juvenil (<25)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: Y_LT25, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp

  - id: paro_registrado
    label: Registered unemployment, y/y
    label_es: Paro registrado, tasa interanual
    section: labour
    source: bde
    key: DPU1JA0D000_TVA
    freq: M
    unit: "%"
    change_unit: pp
    notes: Job seekers registered at public employment offices (SEPE), year-on-year change.

  # ---------------------------------------------------------------- Wages
  - id: wage_cost
    label: Wage cost per worker
    label_es: Coste salarial total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL67
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Monthly average per worker in the quarter, not seasonally adjusted.

  # ---------------------------------------------------------------- Inflation
  - id: cpi
    label: CPI inflation
    label_es: IPC general, variación anual
    section: inflation
    source: ine
    key: IPC290750
    freq: M
    unit: "%"
    change_unit: pp

    tile: 5
  - id: core_cpi
    label: Core CPI inflation
    label_es: IPC subyacente, variación anual
    section: inflation
    source: ine
    key: IPC292510
    freq: M
    unit: "%"
    change_unit: pp
    tile: 6
    notes: Excludes unprocessed food and energy (INE definition).

  - id: cpi_index
    label: CPI index
    label_es: IPC general, índice
    section: inflation
    source: ine
    key: IPC290751
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  - id: core_cpi_index
    label: Core CPI index
    label_es: IPC subyacente, índice
    section: inflation
    source: ine
    key: IPC292511
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  - id: hicp
    label: HICP inflation
    label_es: IPCA, variación anual
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: RCH_A, coicop18: TOTAL}
    freq: M
    unit: "%"
    change_unit: pp
    tile: 7
    notes: Harmonised index, the measure the ECB targets.

  - id: hicp_core
    label: Core HICP inflation
    label_es: IPCA sin energía, alimentos, alcohol y tabaco
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: RCH_A, coicop18: TOT_X_NRG_FOOD}
    freq: M
    unit: "%"
    change_unit: pp

  - id: electricity_price
    label: Electricity price (day-ahead)
    label_es: Precio del mercado eléctrico (spot)
    section: inflation
    source: ree
    key: spot_price
    freq: D
    unit: "€/MWh"
    decimals: 0
    change_unit: "%"
    tile: 15
    notes: Daily average of the Iberian day-ahead market price for Spain.

  # ---------------------------------------------------------------- Activity
  - id: industrial_production
    label: Industrial production (SA)
    label_es: Índice de producción industrial
    section: activity
    source: ine
    key: IPI15360
    freq: M
    unit: index
    transforms: [pop, yoy]

  - id: retail_sales
    label: Real retail sales (SA)
    label_es: Comercio al por menor, precios constantes
    section: activity
    source: ine
    key: ICM4093
    freq: M
    unit: index
    transforms: [pop, yoy]

  - id: car_sales
    label: Car sales
    label_es: Matriculaciones de automóviles
    section: activity
    source: bde
    key: D_1KN31000
    freq: M
    unit: vehicles
    decimals: 0
    transforms: [yoy, level]

  - id: electricity_demand
    label: Electricity demand
    label_es: Demanda eléctrica nacional
    section: activity
    source: ree
    key: demand
    freq: D
    unit: GWh
    scale: 0.001
    change_unit: "%"
    notes: Daily national demand; a real-time activity signal, sensitive to weather and weekdays.

  - id: economic_sentiment
    label: Economic sentiment indicator
    label_es: Indicador de sentimiento económico (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-ESI-I, s_adj: SA}
    freq: M
    unit: index
    notes: European Commission survey; long-run average = 100.

  - id: consumer_confidence
    label: Consumer confidence
    label_es: Confianza del consumidor (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-CSMCI-BAL, s_adj: SA}
    freq: M
    unit: balance

  - id: industry_confidence
    label: Industry confidence
    label_es: Confianza industrial (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-ICI-BAL, s_adj: SA}
    freq: M
    unit: balance

  - id: construction_confidence
    label: Construction confidence
    label_es: Confianza en la construcción (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-CCI-BAL, s_adj: SA}
    freq: M
    unit: balance

  # Tourism
  - id: tourist_arrivals
    label: International tourist arrivals
    label_es: Llegada de turistas internacionales (FRONTUR)
    section: activity
    source: ine
    key: FREG287
    freq: M
    unit: mn
    scale: 0.000001
    transforms: [yoy, level]

    tile: 4
  - id: tourist_spending
    label: International tourist spending
    label_es: Gasto de los turistas internacionales (EGATUR)
    section: activity
    source: ine
    key: FREG375
    freq: M
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, level]

  - id: hotel_nights_foreign
    label: Hotel nights, foreign residents, y/y
    label_es: Pernoctaciones hoteleras de no residentes, tasa interanual
    section: activity
    source: bde
    key: D_1PM2120T
    freq: M
    unit: "%"
    change_unit: pp

  - id: tourism_receipts
    label: Tourism receipts (balance of payments)
    label_es: Ingresos por turismo (balanza de pagos)
    section: activity
    source: bde
    key: DEEM.N.ES.W1.S1.S1.T.C.SD._Z._Z._Z.EUR._T._X.N.ALL
    freq: M
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, level]

  # External
  - id: current_account_monthly
    label: Current account balance (monthly)
    label_es: Saldo de la cuenta corriente
    section: activity
    source: bde
    key: DEEM.N.ES.W1.S1.S1.T.B.CA._Z._Z._Z.EUR._T._X.N.ALL
    freq: M
    unit: "€ mn"
    decimals: 0

  - id: current_account
    label: Current account balance
    label_es: Saldo de la cuenta corriente (% PIB)
    section: activity
    source: eurostat
    key: bop_gdp6_q
    params: {geo: ES, freq: Q, bop_item: CA, stk_flow: BAL, partner: WRL_REST, unit: PC_GDP, s_adj: NSA}
    freq: Q
    unit: "% of GDP"
    change_unit: pp

  # ---------------------------------------------------------------- Housing
  - id: house_prices
    label: House prices
    label_es: Índice de precios de vivienda (IPV)
    section: housing
    source: ine
    key: IPV1209
    freq: Q
    unit: index
    transforms: [yoy, pop]

    tile: 8
  - id: home_sales
    label: Home sales
    label_es: Compraventa de viviendas (ETDP)
    section: housing
    source: ine
    key: ETDP1510
    freq: M
    unit: homes
    decimals: 0
    transforms: [yoy, level]

  # ---------------------------------------------------------------- Fiscal
  - id: government_debt
    label: Government debt
    label_es: Deuda de las AAPP (% PIB)
    section: fiscal
    source: eurostat
    key: gov_10q_ggdebt
    params: {geo: ES, unit: PC_GDP, sector: S13, na_item: GD}
    freq: Q
    unit: "% of GDP"
    change_unit: pp

  - id: government_balance
    label: Government balance (quarter)
    label_es: Capacidad/necesidad de financiación de las AAPP (% PIB)
    section: fiscal
    source: eurostat
    key: gov_10q_ggnfa
    params: {geo: ES, na_item: B9, sector: S13, unit: PC_GDP, s_adj: NSA}
    freq: Q
    unit: "% of GDP"
    change_unit: pp
    notes: Quarterly, not seasonally adjusted; negative = deficit.

  # ---------------------------------------------------------------- ECB
  - id: ecb_deposit_rate
    label: ECB deposit rate
    label_es: Facilidad de depósito del BCE
    section: ecb
    source: ecb
    key: FM/D.U2.EUR.4F.KR.DFR.LEV
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

    tile: 9
  - id: ecb_mro_rate
    label: ECB main refinancing rate
    label_es: Operaciones principales de financiación del BCE
    section: ecb
    source: ecb
    key: FM/D.U2.EUR.4F.KR.MRR_FR.LEV
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: estr
    label: €STR
    label_es: Tipo a corto plazo del euro (€STR)
    section: ecb
    source: ecb
    key: EST/B.EU000A2X2A25.WT
    freq: D
    unit: "%"
    decimals: 3
    change_unit: bp

  # ---------------------------------------------------------------- Financial (Banco de España, daily)
  - id: euribor_3m
    label: 3-month Euribor
    label_es: Euríbor a 3 meses
    section: financial
    source: bde
    key: D_DNBAD172
    freq: D
    unit: "%"
    decimals: 3
    change_unit: bp

  - id: euribor_12m
    label: 12-month Euribor
    label_es: Euríbor a 12 meses
    section: financial
    source: bde
    key: D_DNBAF172
    freq: D
    unit: "%"
    decimals: 3
    change_unit: bp
    tile: 10
    notes: The reference rate for most Spanish variable-rate mortgages.

  - id: es_12m_bill
    label: Spain 12-month bill
    label_es: Letras del Tesoro a 12 meses
    section: financial
    source: bde
    key: DPUDTES00U7
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: es_3y
    label: Spain 3-year yield
    label_es: Bono a 3 años
    section: financial
    source: bde
    key: DPUG0B1F0ZN
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: es_5y
    label: Spain 5-year yield
    label_es: Bono a 5 años
    section: financial
    source: bde
    key: DPUG0B1F0ZO
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: es_10y
    label: Spain 10-year yield
    label_es: Obligaciones a 10 años
    section: financial
    source: bde
    key: DPUG0B1F0ZP
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp
    tile: 11
    notes: Secondary-market yield, all trades in non-stripped bonds with about 10 years to maturity.

  - id: es_30y
    label: Spain 30-year yield
    label_es: Obligaciones a 30 años
    section: financial
    source: bde
    key: DPUG0B1F0ZR
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: de_10y
    label: Germany 10-year yield
    label_es: Bono alemán a 10 años
    section: financial
    source: bde
    key: DPUDNBBN308
    freq: D
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: risk_premium
    label: Prima de riesgo (ES−DE 10y)
    label_es: Prima de riesgo
    section: financial
    source: bde
    key: DPUG0B1F0ZPD
    freq: D
    unit: bp
    scale: 100
    decimals: 0
    change_unit: bp
    tile: 12
    notes: Banco de España's 10-year spread over the German Bund.

  - id: ibex35
    label: IBEX 35
    label_es: IBEX 35
    section: financial
    source: bde
    key: DBLEESI100000000IBDI.B
    freq: D
    unit: index
    decimals: 0
    change_unit: "%"

    tile: 13
  - id: eurusd
    label: EUR/USD
    label_es: Tipo de cambio dólar/euro
    section: financial
    source: ecb
    key: EXR/D.USD.EUR.SP00.A
    freq: D
    unit: rate
    decimals: 4
    change_unit: "%"
    tile: 16
    notes: US dollars per euro, ECB reference rate.

  - id: brent_usd
    label: Brent crude
    label_es: Petróleo Brent
    section: financial
    source: fred
    key: DCOILBRENTEU
    freq: D
    unit: "$/bbl"
    change_unit: "%"
    tile: 14
    notes: Europe Brent spot price (US EIA, via FRED); published with a few days' lag.

  - id: brent_eur
    label: Brent crude in euros
    label_es: Petróleo Brent en euros
    section: financial
    source: derived
    key: divide
    params: {a: brent_usd, b: eurusd, fill: 5}
    freq: D
    unit: "€/bbl"
    change_unit: "%"

  - id: gas_eu
    label: European natural gas
    label_es: Gas natural europeo
    section: financial
    source: fred
    key: PNGASEUUSDM
    freq: M
    unit: "$/MMBtu"
    change_unit: "%"
    notes: Monthly average (IMF primary commodity prices, via FRED).

  - id: mortgage_rate
    label: New mortgage rate
    label_es: Tipo de interés de nuevas hipotecas
    section: housing
    source: ecb
    key: MIR/M.ES.B.A2C.A.R.A.2250.EUR.N
    freq: M
    unit: "%"
    decimals: 2
    change_unit: bp

  # ---------------------------------------------------------------- International comparisons
  - id: hicp_euro_area
    label: Euro area HICP inflation
    label_es: IPCA zona euro
    section: international
    source: eurostat
    key: prc_hicp_minr
    params: {geo: EA, unit: RCH_A, coicop18: TOTAL}
    freq: M
    unit: "%"
    change_unit: pp

  - id: es_10y_monthly
    label: Spain 10-year yield (monthly avg.)
    label_es: Rendimiento a largo plazo, España (convergencia)
    section: international
    source: ecb
    key: IRS/M.ES.L.L40.CI.0000.EUR.N.Z
    freq: M
    unit: "%"
    decimals: 2
    change_unit: bp
    notes: ECB convergence yield, comparable across EU countries; long history.

  - id: de_10y_monthly
    label: Germany 10-year yield (monthly avg.)
    label_es: Rendimiento a largo plazo, Alemania (convergencia)
    section: international
    source: ecb
    key: IRS/M.DE.L.L40.CI.0000.EUR.N.Z
    freq: M
    unit: "%"
    decimals: 2
    change_unit: bp

  - id: risk_premium_monthly
    label: ES−DE 10y spread (monthly avg.)
    label_es: Diferencial con el bund (media mensual)
    section: international
    source: derived
    key: subtract
    params: {a: es_10y_monthly, b: de_10y_monthly, scale: 100}
    freq: M
    unit: bp
    decimals: 0
    change_unit: bp
