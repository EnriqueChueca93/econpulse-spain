# EconPulse Spain indicator registry.
#
# One entry per series. Fields:
#   id           unique name, also the CSV file name in data/series/
#   label        English name;  label_es: official Spanish name
#   section      gdp | labour | wages | inflation | financial | ecb | fiscal | activity | housing | international
#   source       ine | eurostat | ecb | bde | segsocial | fred | ree | derived
#   key, params  what to ask the source for (see econpulse/sources/<source>.py)
#   freq         D | M | Q | A
#   unit         unit of the stored series: "%", "% of GDP", "bp", "pp", "thousands", "$/bbl", "€/MWh",
#                "€ mn", "€", or a plain number shown without suffix: "index", "balance", "rate"
#   scale        multiply fetched values (default 1), e.g. 0.001 for persons -> thousands
#   transforms   how to show it; the first one is the headline (level, pop, yoy, ann3m, saar, diff, diff_yoy;
#                sa_pop, sa_diff… first apply EconPulse seasonal adjustment)
#   decimals     decimals to display (default 1)
#   change_unit  pp | bp for rates; % for relative change (prices, indices, exchange rates)
#   tile         position in the home-page key-indicators strip (omit if not a tile)
#   max_age_days flag the series as "not updating" past this age (defaults by freq)
#
# INE codes are series codes (not table ids): INE moves series to new tables when
# it rebases, so check `python -m econpulse status` if a series stops updating.
# What the section pages show (tables, charts) is defined in econpulse/pages.py.

indicators:

  # ---------------------------------------------------------------- GDP (INE CNTR)
  # Chain-linked volume indices, seasonally and calendar adjusted.
  - id: gdp
    label: Real GDP
    label_es: Producto interior bruto (volumen)
    section: gdp
    source: ine
    key: CNTR6652
    freq: Q
    unit: index
    transforms: [pop, yoy]

    tile: 1
  - id: domestic_demand
    label: Domestic demand
    label_es: Demanda nacional
    section: gdp
    source: ine
    key: CNTR7146
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_households
    label: Household consumption
    label_es: Gasto en consumo final de los hogares
    section: gdp
    source: ine
    key: CNTR7161
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_government
    label: Government consumption
    label_es: Gasto en consumo final de las AAPP
    section: gdp
    source: ine
    key: CNTR7186
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment
    label: Fixed investment
    label_es: Formación bruta de capital fijo
    section: gdp
    source: ine
    key: CNTR7211
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports
    label: Exports
    label_es: Exportaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7265
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: imports
    label: Imports
    label_es: Importaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7285
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_construction
    label: Investment in construction
    label_es: FBCF en construcción
    section: gdp
    source: ine
    key: CNTR7221
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_housing
    label: Investment in housing
    label_es: FBCF en viviendas
    section: gdp
    source: ine
    key: CNTR7226
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_equipment
    label: Investment in machinery and equipment
    label_es: FBCF en maquinaria, bienes de equipo y sistemas de armamento
    section: gdp
    source: ine
    key: CNTR7236
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_goods
    label: Exports of goods
    label_es: Exportaciones de bienes
    section: gdp
    source: ine
    key: CNTR7270
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_services
    label: Exports of services
    label_es: Exportaciones de servicios
    section: gdp
    source: ine
    key: CNTR7275
    freq: Q
    unit: index
    transforms: [pop, yoy]
    notes: Includes spending by foreign tourists in Spain.

  # Contributions to GDP growth, in percentage points, as published by INE.
  - id: contrib_domestic_qq
    label: Domestic demand, contribution to q/q growth
    label_es: Demanda nacional, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7149
    freq: Q
    unit: pp

  - id: contrib_external_qq
    label: External demand, contribution to q/q growth
    label_es: Demanda externa, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7263
    freq: Q
    unit: pp

  - id: contrib_domestic_yy
    label: Domestic demand, contribution to y/y growth
    label_es: Demanda nacional, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7150
    freq: Q
    unit: pp

  - id: contrib_external_yy
    label: External demand, contribution to y/y growth
    label_es: Demanda externa, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7264
    freq: Q
    unit: pp

  # Output by sector: gross value added, chain-linked volumes, adjusted.
  - id: gva_agriculture
    label: Gross value added, agriculture
    label_es: VAB agricultura, ganadería, silvicultura y pesca
    section: gdp
    source: ine
    key: CNTR6657
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_industry
    label: Gross value added, industry
    label_es: VAB industria
    section: gdp
    source: ine
    key: CNTR6662
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_construction
    label: Gross value added, construction
    label_es: VAB construcción
    section: gdp
    source: ine
    key: CNTR6672
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_services
    label: Gross value added, services
    label_es: VAB servicios
    section: gdp
    source: ine
    key: CNTR6677
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gdp_nominal
    label: Nominal GDP
    label_es: PIB a precios corrientes
    section: gdp
    source: ine
    key: CNTR6597
    freq: Q
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, pop]
    notes: Current prices, seasonally and calendar adjusted, euros million per quarter.

  - id: gdp_deflator
    label: GDP deflator
    label_es: Deflactor implícito del PIB
    section: gdp
    source: derived
    key: divide
    params: {a: gdp_nominal, b: gdp}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Nominal GDP divided by real GDP; the price of everything Spain produces.

  - id: jobs_fte
    label: Employment, full-time equivalent jobs
    label_es: Puestos de trabajo equivalentes a tiempo completo
    section: gdp
    source: ine
    key: CNTR7818
    freq: Q
    unit: thousands
    transforms: [yoy, pop]
    notes: National accounts measure, seasonally and calendar adjusted.

  # Already published as % changes on a year earlier.
  - id: productivity_fte
    label: Productivity per FTE job, y/y
    label_es: Productividad por puesto de trabajo equivalente a tiempo completo
    section: gdp
    source: ine
    key: CNTR8241
    freq: Q
    unit: "%"
    change_unit: pp

  - id: productivity_hour
    label: Productivity per hour worked, y/y
    label_es: Productividad por hora efectivamente trabajada
    section: gdp
    source: ine
    key: CNTR8242
    freq: Q
    unit: "%"
    change_unit: pp

  - id: unit_labour_cost
    label: Unit labour cost, y/y
    label_es: Coste laboral unitario
    section: gdp
    source: ine
    key: CNTR8244
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Compensation per employee relative to productivity.

  # ---------------------------------------------------------------- Labour
  - id: afiliados
    label: Social Security registrations
    label_es: Afiliados medios a la Seguridad Social
    section: labour
    source: segsocial
    key: TOTAL SISTEMA
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [sa_diff, diff_yoy, yoy]
    tile: 2
    notes: Monthly average, total system. The monthly change is seasonally adjusted by EconPulse; the y/y change is as published.

  - id: unemployment_epa
    label: Unemployment rate (EPA)
    label_es: Tasa de paro (EPA)
    section: labour
    source: ine
    key: EPA423474
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    tile: 3
    notes: Labour force survey, not seasonally adjusted. The official measure.

  - id: employment_epa
    label: Employment (EPA)
    label_es: Ocupados (EPA)
    section: labour
    source: ine
    key: EPA387796
    freq: Q
    unit: thousands
    transforms: [yoy, diff_yoy, level]

  - id: unemployment_monthly
    label: Unemployment rate, monthly (SA)
    label_es: Tasa de paro mensual (desestacionalizada)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp
    notes: Eurostat's monthly estimate, benchmarked to the EPA.

  - id: youth_unemployment
    label: Youth unemployment rate (<25, SA)
    label_es: Tasa de paro juvenil (<25)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: Y_LT25, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp

  - id: paro_registrado
    label: Registered unemployment
    label_es: Paro registrado
    section: labour
    source: bde
    key: D_1JA0D000
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [diff_yoy, yoy]
    notes: Job seekers registered at public employment offices (SEPE), end of month, not seasonally adjusted.

  - id: activity_rate
    label: Activity rate (EPA)
    label_es: Tasa de actividad (EPA)
    section: labour
    source: ine
    key: EPA388038
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are working or looking for work.

  - id: employment_rate
    label: Employment rate (EPA)
    label_es: Tasa de empleo (EPA)
    section: labour
    source: ine
    key: EPA388039
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are in work.

  - id: temporary_rate
    label: Temporary employment rate (EPA)
    label_es: Tasa de temporalidad (EPA)
    section: labour
    source: ine
    key: EPA416256
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Employees on temporary contracts, % of all employees. The 2022 labour reform cut it sharply.

  - id: long_term_unemployment
    label: Long-term unemployment rate
    label_es: Tasa de paro de larga duración
    section: labour
    source: eurostat
    key: une_ltu_q
    params: {geo: ES, indic_em: LTU, unit: PC_ACT, s_adj: NSA, age: Y15-74, sex: T}
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Unemployed for 12 months or more, % of the labour force aged 15-74 (Eurostat, from the EPA).

  # ---------------------------------------------------------------- Wages
  - id: wage_cost
    label: Wage cost per worker
    label_es: Coste salarial total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL67
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Monthly average per worker in the quarter, not seasonally adjusted.

  - id: wage_cost_ordinary
    label: Ordinary wage cost per worker
    label_es: Coste salarial ordinario por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL66
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Regular pay, leaving out bonuses and back pay; a steadier read on wage growth.

  - id: wage_cost_hour
    label: Wage cost per hour
    label_es: Coste salarial total por hora efectiva (ETCL)
    section: wages
    source: ine
    key: ETCL4371
    freq: Q
    unit: "€"
    decimals: 2
    transforms: [yoy, level]

  - id: labour_cost
    label: Total labour cost per worker
    label_es: Coste laboral total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL68
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Wages plus employers' social contributions and other costs.

  - id: lci_wages
    label: Labour cost index, wages and salaries (SA)
    label_es: Índice de costes laborales, sueldos y salarios
    section: wages
    source: eurostat
    key: lc_lci_r2_q
    params: {geo: ES, unit: I20, s_adj: SCA, lcstruct: D11, nace_r2: B-S}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Eurostat's harmonised measure, seasonally and calendar adjusted.

  - id: compensation_per_employee
    label: Compensation per employee, y/y
    label_es: Remuneración por puesto de trabajo equivalente asalariado
    section: wages
    source: ine
    key: CNTR8243
    freq: Q
    unit: "%"
    change_unit: pp
    notes: National accounts, per full-time equivalent employee.

  - id: wage_agreements
    label: Pay rise agreed in collective agreements
    label_es: Incremento salarial medio pactado en convenios
    section: wages
    source: bde
    key: DCC_M.VS.TOT.TOT._Z.TOT.25000.AC
    freq: M
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Average increase agreed for the current year in agreements registered so far (Ministerio de Trabajo); it restarts each January.

  # ---------------------------------------------------------------- Inflation
  - id: cpi
    label: CPI inflation
    label_es: IPC general, variación anual
    section: inflation
    source: ine
    key: IPC290750
    freq: M
    unit: "%"
    change_unit: pp

    tile: 5
  - id: core_cpi
    label: Core CPI inflation
    label_es: IPC subyacente, variación anual
    section: inflation
    source: ine
    key: IPC292510
    freq: M
    unit: "%"
    change_unit: pp
    tile: 6
    notes: Excludes unprocessed food and energy (INE definition).

  - id: cpi_index
    label: CPI index
    label_es: IPC general, índice
    section: inflation
    source: ine
    key: IPC290751
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  - id: core_cpi_index
    label: Core CPI index
    label_es: IPC subyacente, índice
    section: inflation
    source: ine
    key: IPC292511
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  # CPI special groups (INE "grupos especiales"): core = processed food + goods + services.
  - id: cpi_services_index
    label: CPI services
    label_es: IPC servicios, índice
    section: inflation
    source: ine
    key: IPC292495
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_goods_index
    label: CPI non-energy industrial goods
    label_es: IPC bienes industriales sin productos energéticos, índice
    section: inflation
    source: ine
    key: IPC292531
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_processed_food_index
    label: CPI processed food, drinks and tobacco
    label_es: IPC alimentos con elaboración, bebidas y tabaco, índice
    section: inflation
    source: ine
    key: IPC292543
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_unprocessed_food_index
    label: CPI unprocessed food
    label_es: IPC alimentos sin elaboración, índice
    section: inflation
    source: ine
    key: IPC292443
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_energy_index
    label: CPI energy
    label_es: IPC productos energéticos, índice
    section: inflation
    source: ine
    key: IPC292459
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_rent_index
    label: CPI rents
    label_es: IPC vivienda en alquiler, índice
    section: inflation
    source: ine
    key: IPC292307
    freq: M
    unit: index
    transforms: [yoy, pop]

  # Needs the CPI index above, so it sits here rather than with the other wages.
  - id: real_wage
    label: Real wage cost per worker
    label_es: Coste salarial por trabajador deflactado por el IPC
    section: wages
    source: derived
    key: deflate
    params: {a: wage_cost, b: cpi_index, period: Q}
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy]
    notes: Wage cost per worker (ETCL) divided by the CPI averaged over the quarter.

  - id: ppi
    label: Producer prices
    label_es: Índice de precios industriales, mercado interior
    section: inflation
    source: ine
    key: IPR34522
    freq: M
    unit: index
    transforms: [yoy, pop]
    notes: Prices charged by Spanish industry on the domestic market; an early signal for consumer prices.

  - id: hicp
    label: HICP inflation
    label_es: IPCA, variación anual
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: RCH_A, coicop18: TOTAL}
    freq: M
    unit: "%"
    change_unit: pp
    tile: 7
    notes: Harmonised index, the measure the ECB targets.

  - id: hicp_core
    label: Core HICP inflation
    label_es: IPCA sin energía, alimentos, alcohol y tabaco
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: RCH_A, coicop18: TOT_X_NRG_FOOD}
    freq: M
    unit: "%"
    change_unit: pp

  - id: hicp_index
    label: HICP index
    label_es: IPCA, índice
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: I25, coicop18: TOTAL}
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: hicp_core_index
    label: Core HICP index
    label_es: IPCA sin energía, alimentos, alcohol y tabaco, índice
    section: inflation
    source: eurostat
    key: prc_hicp_minr
    params: {geo: ES, unit: I25, coicop18: TOT_X_NRG_FOOD}
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: price_expectations
    label: Consumers' price expectations
    label_es: Expectativas de precios de los consumidores (CE)
    section: inflation
    source: eurostat
    key: ei_bsco_m
    params: {geo: ES, indic: BS-PT-NY, s_adj: SA, unit: BAL}
    freq: M
    unit: balance
    notes: European Commission consumer survey, prices over the next 12 months; net balance of households expecting faster rises.

  - id: electricity_price
    label: Electricity price (day-ahead)
    label_es: Precio del mercado eléctrico (spot)
    section: inflation
    source: ree
    key: spot_price
    freq: D
    unit: "€/MWh"
    decimals: 0
    change_unit: "%"
    tile: 15
    notes: Daily average of the Iberian day-ahead market price for Spain.

  # ---------------------------------------------------------------- Activity
  - id: industrial_production
    label: Industrial production (SA)
    label_es: Índice de producción industrial
    section: activity
    source: ine
    key: IPI15360
    freq: M
    unit: index
    transforms: [pop, yoy]

  - id: retail_sales
    label: Real retail sales (SA)
    label_es: Comercio al por menor, precios constantes
    section: activity
    source: ine
    key: ICM4093
    freq: M
    unit: index
    transforms: [pop, yoy]

  - id: car_sales
    label: Car sales
    label_es: Matriculaciones de automóviles
    section: activity
    source: bde
    key: D_1KN31000
    freq: M
    unit: vehicles
    decimals: 0
    transforms: [yoy, level]

  - id: electricity_demand
    label: Electricity demand
    label_es: Demanda eléctrica nacional
    section: activity
    source: ree
    key: demand
    freq: D
    unit: GWh
    scale: 0.001
    change_unit: "%"
    notes: Daily national demand; a real-time activity signal, sensitive to weather and weekdays.

  - id: economic_sentiment
    label: Economic sentiment indicator
    label_es: Indicador de sentimiento económico (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-ESI-I, s_adj: SA}
    freq: M
    unit: index
    notes: European Commission survey; long-run average = 100.

  - id: consumer_confidence
    label: Consumer confidence
    label_es: Confianza del consumidor (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-CSMCI-BAL, s_adj: SA}
    freq: M
    unit: balance

  - id: industry_confidence
    label: Industry confidence
    label_es: Confianza industrial (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-ICI-BAL, s_adj: SA}
    freq: M
    unit: balance

  - id: construction_confidence
    label: Construction confidence
    label_es: Confianza en la construcción (CE)
    section: activity
    source: eurostat
    key: ei_bssi_m_r2
    params: {geo: ES, indic: BS-CCI-BAL, s_adj: SA}
    freq: M
    unit: balance

  # Tourism
  - id: tourist_arrivals
    label: International tourist arrivals
    label_es: Llegada de turistas internacionales (FRONTUR)
    section: activity
    source: ine
    key: FREG287
    freq: M
    unit: mn
    scale: 0.000001
    transforms: [yoy, level]

    tile: 4
  - id: tourist_spending
    label: International tourist spending
    label_es: Gasto de los turistas internacionales (EGATUR)
    section: activity
    source: ine
    key: FREG375
    freq: M
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, level]

  - id: hotel_nights_foreign
    label: Hotel nights, foreign residents, y/y
    label_es: Pernoctaciones hoteleras de no residentes, tasa interanual
    section: activity
    source: bde
    key: D_1PM2120T
    freq: M
    unit: "%"
    change_unit: pp

  - id: tourism_receipts
    label: Tourism receipts (balance of payments)
    label_es: Ingresos por turismo (balanza de pagos)
    section: activity
    source: bde
    key: DEEM.N.ES.W1.S1.S1.T.C.SD._Z._Z._Z.EUR._T._X.N.ALL
    freq: M
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, level]

  # External
  - id: current_account_monthly
    label: Current account balance (monthly)
    label_es: Saldo de la cuenta corriente
    section: activity
    source: bde
    key: DEEM.N.ES.W1.S1.S1.T.B.CA._Z._Z._Z.EUR._T._X.N.ALL
    freq: M
    unit: "€ mn"
    decimals: 0

  - id: current_account
    label: Current account balance
    label_es: Saldo de la cuenta corriente (% PIB)
    section: activity
    source: eurostat
    key: bop_gdp6_q
