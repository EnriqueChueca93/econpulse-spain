# Forecasts entered by hand. Every forecaster is now read automatically (fc_* in
# indicators.yaml), so this file is only for overrides: an entry here replaces the
# automatic figures when its `published` month is later, for example a new government
# forecast the FUNCAS Panel has not listed yet. Hand entries count without an AI check,
# so copy the figures from the publisher's own document.
#
# Per forecaster:
#   id            bde, funcas, airef, government, imf, oecd or ec to override one of the
#                 automatic forecasters (or a new id to add another)
#   name, url     shown in the table; url is the page the numbers come from
#   short         a short name for the chart
#   group         spain or international
#   published     date of the edition (YYYY-MM-DD)
#   inflation     what their inflation figure measures: HICP or CPI
#   note          optional, shown under the table
#   values        per year: gdp (real growth, %), inflation (annual average, %),
#                 unemployment (annual average, % of the labour force) and balance
#                 (general government budget balance, % of GDP; negative = deficit).
#                 Leave out what the forecaster does not publish.
#
# Example:
#   - id: government
#     name: Government
#     short: Government
#     group: spain
#     url: https://portal.mineco.gob.es/...
#     published: 2026-10-15
#     inflation: CPI
#     values:
#       2026: {gdp: 2.7, unemployment: 9.8, balance: -2.0}
#       2027: {gdp: 2.3, unemployment: 9.3, balance: -1.7}

forecasters: []
