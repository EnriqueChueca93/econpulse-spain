name: Update and deploy

# Once a day: fetch the latest data, rebuild the site, save the data back to the
# repository (so the next run only downloads what is new, and "what changed" keeps
# its baseline) and publish site/ to GitHub Pages.
# A push of code changes rebuilds and republishes from the data already saved, and so does a push of an AI
# check (data/*_checks.json, from `python -m econpulse confirm`), so a checked figure shows as checked at once.
# After each build, an issue labelled "ai-check" stays open while any figure awaits an AI check
# (scripts/ai_check_issue.sh), so GitHub tells the repository's owner.

on:
  schedule:
    - cron: "30 17 * * *"   # 17:30 UTC: 18:30 Madrid in winter, 19:30 in summer (GitHub may start it a little late)
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                   # everything but the data, except the AI checks
      - "**"
      - "!data/**"
      - "data/*_checks.json"

permissions:
  contents: write            # to save the updated data
  issues: write              # to open and close the "ai-check" issue
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests
        run: python -m pytest -q

      - name: Fetch and build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m econpulse build
          else
            python -m econpulse update
          fi
          python -m econpulse status

      - name: Save the new data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M') Madrid"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Flag figures awaiting an AI check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MENTION: ${{ github.repository_owner }}
        run: bash scripts/ai_check_issue.sh
